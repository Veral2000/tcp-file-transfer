name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # Windows test execution is temporarily disabled while the test suite
      # is being made runtime-safe for MSVC. Windows compilation remains
      # covered by CI so portability regressions are still detected.
      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: ctest --test-dir build -C Release --output-on-failure
