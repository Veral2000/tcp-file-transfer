name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: tcp-file-transfer-linux-x64
          - os: windows-latest
            artifact: tcp-file-transfer-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package
          cp build/ft-client package/ft-client
          cp build/ft-server package/ft-server
          tar -czf "${{ matrix.artifact }}.tar.gz" -C package .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/ft-client.exe package/ft-client.exe
          Copy-Item build/Release/ft-server.exe package/ft-server.exe
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.artifact }}.zip" -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.tar.gz
            *.zip

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: tcp-file-transfer-linux-x64
          path: release

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: tcp-file-transfer-windows-x64
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
