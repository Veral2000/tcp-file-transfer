services:
  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: tcp-file-transfer:latest
    container_name: tcp-file-transfer-server
    restart: unless-stopped
    ports:
      - "${TCPFT_PORT:-9000}:9000"
    volumes:
      - tcpft-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  tcpft-data:
